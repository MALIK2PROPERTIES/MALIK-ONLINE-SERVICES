
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Malik Online Services</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102a43, #0e7490);
    }
    .card {
      width: 100%; max-width: 410px; background: white;
      padding: 30px; border-radius: 18px;
      box-shadow: 0 20px 50px #0003;
    }
    h1 { margin: 0 0 8px; color: #102a43; font-size: 25px; }
    p { color: #5c7182; line-height: 1.5; }
    label { display: block; margin: 17px 0 7px; font-weight: bold; }
    input {
      width: 100%; padding: 13px; border: 1px solid #ccd9e0;
      border-radius: 9px; font-size: 16px;
    }
    button {
      width: 100%; padding: 13px; margin-top: 20px;
      border: 0; border-radius: 9px; background: #0e7490;
      color: white; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { overflow-wrap: anywhere; font-size: 14px; }
    .success { color: #087443; }
    .error { color: #b42318; }
    .note { font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Malik Online Services</h1>
    <p>Admin Panel — Please sign in with your registered admin account.</p>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input id="email" type="email" autocomplete="username"
        placeholder="Enter your registered email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password"
        placeholder="Enter your password" required>

      <button id="loginButton" type="submit">Admin Login</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <button id="logoutButton" type="button" hidden>Logout</button>

    <p class="note">
      Sign-in uses Supabase Authentication. Administrative permissions
      must also be enforced by database security policies.
    </p>
  </main>

  <script>
    const SUPABASE_URL = "https://akajbjwkclcwdvibarah.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_jWEXNf3_eUxQ3ZaisT4kNA_aeJVddoz";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const logoutButton = document.getElementById("logoutButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.className = "";
      message.textContent = "Signing in...";

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;

        message.className = "success";
        message.textContent =
          "Login successful for " + data.user.email +
          ". Admin permissions and dashboard data still need verification.";

        form.hidden = true;
        logoutButton.hidden = false;
      } catch (error) {
        message.className = "error";
        message.textContent =
          "Login failed: " + error.message;
      } finally {
        button.disabled = false;
      }
    });

    logoutButton.addEventListener("click", async () => {
      const { error } = await client.auth.signOut();

      if (error) {
        message.className = "error";
        message.textContent = "Logout failed: " + error.message;
        return;
      }

      form.reset();
      form.hidden = false;
      logoutButton.hidden = true;
      message.className = "";
      message.textContent = "You have been logged out.";
    });
  </script>
</body>
</html>
